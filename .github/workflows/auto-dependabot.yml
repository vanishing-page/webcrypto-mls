name: Auto-merge Dependabot PRs

on:
  pull_request:
    types: [opened, edited, reopened, labeled, unlabeled, synchronize]
    branches: [main]

# Merging needs write access to the repository contents and the pull
# request; nothing else.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only Dependabot's own branches, opened by Dependabot. A `paths`
    # filter matches changed files, not branch names, so it cannot do
    # this.
    if: >-
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Run Tests
      run: |
        npm install
        npm test

    # `labels.*.name` is an array, so compare with contains() rather
    # than `!=`, which is always true.
    - name: Merge PR
      if: >-
        success() &&
        !contains(github.event.pull_request.labels.*.name, 'do-not-merge')
      uses: actions/github-script@v8
      with:
        script: |
          await github.rest.pulls.merge({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.payload.pull_request.number,
            merge_method: 'merge'
          });
